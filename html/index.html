<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAC - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="contenedor-login">
        <div class="tarjeta-login">
            <div class="encabezado-login">
                <h2>IMAC</h2>
                <p>Sistema de Gestión Empresarial</p>
            </div>
            
            <!-- El formulario que luego conectaremos a Java -->
            <form action="#" method="POST" class="formulario">
                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="admin@imac.com" required>
                </div>
                
                <div class="grupo-input">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-ingresar">Ingresar al Sistema</button>
            </form>
            
            <div class="pie-login">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>
</body>
<script src="../js/index.js"></script>
</html>
