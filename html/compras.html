<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAC - Registro de Compras</title>
    <link rel="stylesheet" href="../css/compras.css">
</head>
<body>

    <header class="encabezado-compras">
        <div class="titulo-sistema">
            <h1>MODULO DE COMPRAS</h1>
            <p>Ingreso de mercancia y liquidacion de facturas</p>
        </div>
        <div class="acciones-usuario">
            <span class="etiqueta-consecutivo">Factura Interna #1045</span>
            <button class="btn-secundario" id="btn-volver">Volver al Dashboard</button>
        </div>
    </header>

    <main class="contenedor-compras">
        
        <!-- Panel 1: Datos Generales -->
        <section class="panel-seccion">
            <h2>Datos del Proveedor y Factura</h2>
            <div class="formulario-grid">
                <div class="grupo-input">
                    <label for="fecha">Fecha de Ingreso</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="grupo-input">
                    <label for="factura">Numero de Factura</label>
                    <input type="text" id="factura" placeholder="Ej. FAC-001">
                </div>
                <div class="grupo-input span-2">
                    <label for="proveedor">Proveedor</label>
                    <div class="input-con-boton">
                        <select id="proveedor">
                            <option value="">Seleccione un proveedor...</option>
                            <option value="PROV1">Cementos Nacionales S.A.</option>
                            <option value="PROV2">Distribuidora de Tecnologia</option>
                        </select>
                        <button class="btn-accion-pequeno" title="Nuevo Proveedor">➕</button>
                    </div>
                </div>
                <div class="grupo-input span-2">
                    <label for="comentario">Comentarios u Observaciones</label>
                    <input type="text" id="comentario" placeholder="Opcional...">
                </div>
            </div>
        </section>

        <!-- Panel 2: Liquidacion de Productos -->
        <section class="panel-seccion">
            <h2>Liquidador de Productos</h2>
            <div class="liquidador-grid">
                
                <div class="grupo-input span-2">
                    <label for="producto-desc">Buscar Producto</label>
                    <div class="input-con-boton">
                        <select id="producto-desc">
                            <option value="">Seleccione o busque...</option>
                            <option value="PROD-01">Arena de Rio (Bulto)</option>
                            <option value="PROD-02">Laptop Dell (Unidad)</option>
                        </select>
                        <button class="btn-accion-pequeno" title="Crear Producto">➕</button>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="cant">Cantidad</label>
                    <input type="number" id="cant" min="1" value="1">
                </div>

                <div class="grupo-input">
                    <label for="costo">Costo Base Unit.</label>
                    <input type="number" id="costo" min="0" value="0" step="0.01">
                </div>

                <div class="grupo-input">
                    <label for="desc">Descuento Total</label>
                    <input type="number" id="desc" min="0" value="0" step="0.01">
                </div>

                <div class="grupo-input">
                    <label for="subt">Subtotal</label>
                    <input type="text" id="subt" class="campo-bloqueado" value="0.00" readonly>
                </div>

                <div class="grupo-input">
                    <label for="imp">Impuesto (IVA/Otros)</label>
                    <input type="number" id="imp" min="0" value="0" step="0.01">
                </div>

                <div class="grupo-input">
                    <label for="tot">Total Fila</label>
                    <input type="text" id="tot" class="campo-bloqueado destacado" value="0.00" readonly>
                </div>

            </div>
            
            <div class="acciones-liquidador">
                <button class="btn-primario" id="btn-agregar-fila">⬇️ Agregar a la Factura</button>
            </div>
        </section>

        <!-- Panel 3: Carrito y Totales -->
        <section class="panel-seccion">
            <h2>Detalle de la Factura</h2>
            <div class="tabla-contenedor">
                <table id="tabla-detalle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cant.</th>
                            <th>Costo U.</th>
                            <th>Desc.</th>
                            <th>Subtotal</th>
                            <th>Impuesto</th>
                            <th>Total</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas dinamicas -->
                    </tbody>
                </table>
            </div>

            <div class="resumen-inferior">
                <div class="grupo-botones-finales">
                    <button class="btn-guardar" id="btn-guardar">💾 Guardar Compra</button>
                    <button class="btn-limpiar" id="btn-limpiar">🧹 Limpiar Todo</button>
                </div>

                <div class="cajas-totales">
                    <div class="caja-total">
                        <span>Subtotal Global</span>
                        <input type="text" id="gran-subtotal" value="$ 0.00" readonly>
                    </div>
                    <div class="caja-total">
                        <span>Impuestos</span>
                        <input type="text" id="gran-impuesto" value="$ 0.00" readonly>
                    </div>
                    <div class="caja-total total-final">
                        <span>Gran Total</span>
                        <input type="text" id="gran-total" value="$ 0.00" readonly>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="../js/compras.js"></script>
</body>
</html>
