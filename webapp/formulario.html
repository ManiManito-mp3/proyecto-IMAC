<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Clientes IMAC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000080; color: white; padding: 20px; }
        .formulario { background-color: #2e8b57; padding: 20px; border-radius: 8px; width: 300px; margin: 0 auto; }
        input, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background-color: #ff8c00; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="formulario">
        <h2>Nuevo Cliente</h2>
        <!-- El action debe coincidir con la ruta del Servlet -->
        <form action="registroCliente" method="POST">
            <input type="text" name="doc" placeholder="Documento" required>
            <input type="text" name="nombre" placeholder="Nombre (Ej. Constructora)" required>
            <input type="text" name="telefono" placeholder="Teléfono" required>
            <input type="text" name="direccion" placeholder="Dirección" required>
            <input type="email" name="email" placeholder="Correo" required>
            <button type="submit">Guardar Cliente</button>
        </form>
    </div>
</body>
</html>
